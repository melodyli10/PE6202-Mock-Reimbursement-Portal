<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Overtime Taxi Reimbursement</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    /* HEADER */

    .header {
      background: #173b57;
      color: white;
      padding: 30px 0;
    }

    .header-inner {
      width: 760px;
      max-width: calc(100% - 40px);
      margin: auto;
    }

    .company {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 7px;
      opacity: 0.9;
    }

    .header h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 700;
    }

    /* PAGE */

    .container {
      width: 760px;
      max-width: calc(100% - 40px);
      margin: 42px auto 70px;
    }

    .card {
      background: white;
      border: 1px solid #d9e1e7;
      border-radius: 8px;
      padding: 46px 48px 50px;
      box-shadow: 0 2px 9px rgba(0,0,0,0.05);
    }

    .form-title {
      margin: 0 0 42px;
      color: #173b57;
      font-size: 24px;
      font-weight: 700;
    }

    /* FORM */

    .form-group {
      margin-bottom: 35px;
    }

    label {
      display: block;
      margin-bottom: 11px;
      font-size: 16px;
      font-weight: 700;
      color: #28394a;
    }

    .required {
      color: #c62828;
    }

    input {
      width: 100%;
      height: 54px;
      padding: 0 15px;

      border: 1px solid #bfcbd4;
      border-radius: 5px;

      background: white;
      color: #1f2937;

      font-size: 16px;
    }

    input:hover {
      border-color: #8fa1ae;
    }

    input:focus {
      outline: none;
      border-color: #176b8f;
      box-shadow: 0 0 0 3px rgba(23,107,143,0.12);
    }

    .amount-wrapper {
      position: relative;
    }

    .currency {
      position: absolute;
      right: 16px;
      top: 17px;

      color: #637482;
      font-size: 14px;
      font-weight: 700;
    }

    .amount-input {
      padding-right: 70px;
    }

    /* SUBMIT */

    button {
      width: 100%;
      height: 54px;

      margin-top: 15px;

      border: none;
      border-radius: 5px;

      background: #176b8f;
      color: white;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #125874;
    }

    /* SUCCESS */

    #submissionResult {
      display: none;

      margin-top: 35px;
      padding: 24px;

      border: 1px solid #9dcfb0;
      border-left: 5px solid #15834f;
      border-radius: 6px;

      background: #edf8f1;
    }

    .success-title {
      margin-bottom: 16px;

      color: #176a43;

      font-size: 18px;
      font-weight: 700;
    }

    .result-row {
      margin-top: 10px;
      font-size: 16px;
    }

    .result-label {
      font-weight: 700;
    }

    #claimId,
    #submissionStatus {
      color: #176a43;
      font-weight: 700;
    }

    @media (max-width: 650px) {

      .card {
        padding: 32px 25px 38px;
      }

    }

  </style>
</head>


<body>


  <div class="header">

    <div class="header-inner">

      <div class="company">
        Northbridge Securities
      </div>

      <h1>
        Overtime Taxi Reimbursement
      </h1>

    </div>

  </div>


  <div class="container">


    <div class="card">


      <h2 class="form-title">
        New Expense Claim
      </h2>


      <form id="claimForm">


        <!-- EMPLOYEE -->

        <div class="form-group">

          <label for="employeeName">
            Employee Name
            <span class="required">*</span>
          </label>

          <input
            type="text"
            id="employeeName"
            name="Employee Name"
            required
          >

        </div>


        <!-- BATCH -->

        <div class="form-group">

          <label for="batchId">
            Batch ID
            <span class="required">*</span>
          </label>

          <input
            type="text"
            id="batchId"
            name="Batch ID"
            required
          >

        </div>


        <!-- ORIGINAL -->

        <div class="form-group">

          <label for="originalAmount">
            Total Original Amount
            <span class="required">*</span>
          </label>


          <div class="amount-wrapper">

            <input
              type="number"
              id="originalAmount"
              name="Total Original Amount"
              class="amount-input"
              min="0"
              step="0.01"
              required
            >

            <span class="currency">
              CNY
            </span>

          </div>

        </div>


        <!-- REIMBURSABLE -->

        <div class="form-group">

          <label for="reimbursableAmount">
            Total Reimbursable Amount
            <span class="required">*</span>
          </label>


          <div class="amount-wrapper">

            <input
              type="number"
              id="reimbursableAmount"
              name="Total Reimbursable Amount"
              class="amount-input"
              min="0"
              step="0.01"
              required
            >

            <span class="currency">
              CNY
            </span>

          </div>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          id="submitButton"
        >
          Submit
        </button>


      </form>


      <!-- RESULT -->

      <div id="submissionResult">


        <div
          class="success-title"
          id="successMessage"
        >
          Claim submitted successfully
        </div>


        <div class="result-row">

          <span class="result-label">
            Claim ID:
          </span>

          <span id="claimId"></span>

        </div>


        <div class="result-row">

          <span class="result-label">
            Submission Status:
          </span>

          <span id="submissionStatus">
            SUCCESS
          </span>

        </div>


      </div>


    </div>


  </div>


  <script>

    document
      .getElementById("claimForm")
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();


          const batchId =
            document
              .getElementById("batchId")
              .value
              .trim();


          const safeBatchId =
            batchId
              .replace(/[^a-zA-Z0-9]/g, "")
              .toUpperCase();


          const claimId =
            "CLM-" +
            safeBatchId +
            "-001";


          document
            .getElementById("claimId")
            .textContent =
            claimId;


          document
            .getElementById("submissionStatus")
            .textContent =
            "SUCCESS";


          document
            .getElementById("submissionResult")
            .style.display =
            "block";


          document
            .getElementById("submissionResult")
            .scrollIntoView({
              behavior: "smooth",
              block: "center"
            });

        }
      );

  </script>


</body>

</html>
