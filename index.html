<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Overtime Taxi Reimbursement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .header {
      background: #173b57;
      color: white;
      padding: 22px 40px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      width: 720px;
      max-width: calc(100% - 40px);
      margin: 35px auto;
    }

    .card {
      background: white;
      border: 1px solid #d9e1e7;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .form-title {
      margin: 0 0 25px;
      font-size: 22px;
      color: #173b57;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .required {
      color: #c62828;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bfcbd4;
      border-radius: 5px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #176b8f;
      box-shadow: 0 0 0 2px rgba(23, 107, 143, 0.12);
    }

    .currency {
      margin-top: 7px;
      font-weight: 600;
      color: #52616f;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: none;
      border-radius: 5px;
      background: #176b8f;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #125874;
    }

    #submissionResult {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #9dcfb0;
      border-left: 5px solid #15834f;
      border-radius: 6px;
      background: #edf8f1;
    }

    .success-title {
      margin-bottom: 12px;
      color: #176a43;
      font-size: 17px;
      font-weight: 700;
    }

    .result-row {
      margin-top: 8px;
      font-size: 15px;
    }

    .result-label {
      font-weight: 700;
    }

    #claimId,
    #submissionStatus {
      font-weight: 700;
      color: #176a43;
    }

    @media (max-width: 650px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Northbridge Securities | Expense Claim</h1>
  </div>

  <div class="container">

    <div class="card">

      <h2 class="form-title">
        Overtime Taxi Reimbursement
      </h2>

      <form id="claimForm">

        <div class="form-group">
          <label for="employeeName">
            Employee Name
            <span class="required">*</span>
          </label>

          <input
            type="text"
            id="employeeName"
            name="Employee Name"
            required
          >
        </div>


        <div class="form-group">
          <label for="batchId">
            Batch ID
            <span class="required">*</span>
          </label>

          <input
            type="text"
            id="batchId"
            name="Batch ID"
            required
          >
        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="originalAmount">
              Total Original Amount
              <span class="required">*</span>
            </label>

            <input
              type="number"
              id="originalAmount"
              name="Total Original Amount"
              step="0.01"
              min="0"
              required
            >

            <div class="currency">
              CNY
            </div>

          </div>


          <div class="form-group">

            <label for="reimbursableAmount">
              Total Reimbursable Amount
              <span class="required">*</span>
            </label>

            <input
              type="number"
              id="reimbursableAmount"
              name="Total Reimbursable Amount"
              step="0.01"
              min="0"
              required
            >

            <div class="currency">
              CNY
            </div>

          </div>

        </div>


        <button
          type="submit"
          id="submitButton"
        >
          Submit
        </button>

      </form>


      <div id="submissionResult">

        <div
          class="success-title"
          id="successMessage"
        >
          Claim submitted successfully
        </div>

        <div class="result-row">
          <span class="result-label">
            Claim ID:
          </span>

          <span id="claimId"></span>
        </div>

        <div class="result-row">
          <span class="result-label">
            Submission Status:
          </span>

          <span id="submissionStatus">
            SUCCESS
          </span>
        </div>

      </div>

    </div>

  </div>


  <script>

    document
      .getElementById("claimForm")
      .addEventListener(
        "submit",
        function (event) {

          event.preventDefault();

          const batchId =
            document
              .getElementById("batchId")
              .value
              .trim();

          const safeBatchId =
            batchId
              .replace(/[^a-zA-Z0-9]/g, "")
              .toUpperCase();

          const claimId =
            "CLM-" +
            safeBatchId +
            "-001";

          document
            .getElementById("claimId")
            .textContent =
            claimId;

          document
            .getElementById("submissionStatus")
            .textContent =
            "SUCCESS";

          document
            .getElementById("submissionResult")
            .style.display =
            "block";

        }
      );

  </script>

</body>

</html>
